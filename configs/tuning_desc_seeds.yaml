# Seed tuning for the description extension (implementation_plan.md, §10). Training questions
# only (D7), the same sample as Phase 6 and §9 (500 Spider + 500 Bird training questions, seed 42).

seed: 42
sample_size: 500
datasets: [spider, bird]
objective: TR@5
tie_breaker: DR@1
output: configs/seeds.yaml      # the new settings are added; §9 settings are kept
results: results/tuning
cutoff: 100

weight_step: 0.1                # weights of (BM25, schema embedding, description embedding)

rerank:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  max_length: 256
  batch_size: 128
  device: auto
  top_k: [10, 20, 30, 50]       # same grid as the extended §9 grid
  weight: [0.1, 0.25, 0.5, 0.75, 1.0]
